name: SuperPonto v2 — servidores

# Publica a v2 nos servidores próprios (sistema e comunicação) depois de cada publicação da v2.
# DESLIGADO até a troca: hoje o sistema em produção é o da Vercel + Supabase ("Publicar sistema").
# Para ligar: Settings > Secrets and variables > Actions >
#   variável V2_DEPLOY_ENABLED = true
#   secrets V2_SSH_HOST, V2_SSH_USER, V2_SSH_KEY (e V2_DIR, padrão /opt/superponto)
#   opcional, servidor de comunicação: COMM_SSH_HOST, COMM_SSH_USER, COMM_SSH_KEY (e COMM_DIR)
on:
  workflow_run:
    workflows: ['SuperPonto v2 — publicação']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-v2
  cancel-in-progress: false

jobs:
  system:
    name: Servidor do sistema
    if: vars.V2_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production-v2
    steps:
      - name: Atualizar no servidor
        env:
          HOST: ${{ secrets.V2_SSH_HOST }}
          USER: ${{ secrets.V2_SSH_USER }}
          KEY: ${{ secrets.V2_SSH_KEY }}
          DIR: ${{ secrets.V2_DIR || '/opt/superponto' }}
        run: |
          [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$KEY" ] || { echo "::error::Defina V2_SSH_HOST, V2_SSH_USER e V2_SSH_KEY"; exit 1; }
          install -m 700 -d ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id "$USER@$HOST" "set -e; cd '$DIR' && git pull --ff-only && cd platform && \
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env pull && \
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --remove-orphans && \
            docker image prune -f"

  communication:
    name: Servidor de comunicação
    if: vars.V2_DEPLOY_ENABLED == 'true' && vars.COMM_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production-v2
    steps:
      - name: Atualizar no servidor de comunicação
        env:
          HOST: ${{ secrets.COMM_SSH_HOST }}
          USER: ${{ secrets.COMM_SSH_USER }}
          KEY: ${{ secrets.COMM_SSH_KEY }}
          DIR: ${{ secrets.COMM_DIR || '/opt/superponto-communication-server' }}
        run: |
          [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$KEY" ] || { echo "::error::Defina COMM_SSH_HOST, COMM_SSH_USER e COMM_SSH_KEY"; exit 1; }
          install -m 700 -d ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id "$USER@$HOST" "set -e; cd '$DIR' && git pull --ff-only && docker compose pull && docker compose up -d && docker image prune -f"
