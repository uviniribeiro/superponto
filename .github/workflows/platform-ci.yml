name: SuperPonto v2 (platform)

on:
  push:
    branches: [main]
    paths: ['platform/**', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/platform-ci.yml']

permissions:
  contents: read

jobs:
  test:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      # Diretório de teste para o login por LDAP/Active Directory.
      openldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: Teste
          LDAP_DOMAIN: empresa.test
          LDAP_ADMIN_PASSWORD: admin-ldap
        ports: ['1389:389']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Build dos pacotes
        run: |
          npm run build -w @superponto/br-docs
          npm run build -w @superponto/rep-protocols
          npm run build -w @superponto/time-engine
          npm run build -w @superponto/database
      - name: Typecheck
        run: |
          npm run typecheck -w @superponto/time-engine
          npm run typecheck -w @superponto/api
          npm run typecheck -w @superponto/web
      - name: CNPJ, CPF e PIS
        run: npm test -w @superponto/br-docs
      - name: Protocolos de REP (AFD 1.510/671, comandos)
        run: |
          npm run typecheck -w @superponto/rep-protocols
          npm test -w @superponto/rep-protocols
      - name: Agente local (drivers Control iD e simulador)
        run: |
          npm run typecheck -w @superponto/agent
          npm test -w @superponto/agent
          npm run build -w @superponto/agent
      - name: Manual e conformidade em dia
        run: |
          npm run docs -w @superponto/web
          git diff --exit-code -- MANUAL.md CONFORMIDADE_MTE.md || { echo "::error::Rode 'npm run docs -w @superponto/web' e faça commit dos .md gerados"; exit 1; }
      - name: Motor de jornada
        run: npm test -w @superponto/time-engine
      - name: API (PostgreSQL real, RLS, contrato de autenticação)
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:dev@127.0.0.1:55432/postgres
          TEST_LDAP_URL: ldap://127.0.0.1:1389
        run: npm test -w @superponto/api
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0
      - name: API em Dart (os mesmos testes de contrato, contra o servidor Dart)
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:dev@127.0.0.1:55432/postgres
          TEST_LDAP_URL: ldap://127.0.0.1:1389
          API_TARGET: dart
        run: |
          (cd dart && dart pub get)
          npm test -w @superponto/api
      - name: Build da API
        run: npm run build -w @superponto/api
      - name: Build do site (Next.js)
        run: npm run build -w @superponto/web

  dart-core:
    name: Dart (regras, motor de jornada e protocolos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - name: Testes (inclui paridade com o motor TypeScript)
        working-directory: platform/dart/packages/sp_core
        run: dart test
      - name: Servidor Dart (criptografia compatível, LDAP, validação, XLSX)
        working-directory: platform/dart/server
        run: dart test
      - name: Binário nativo do servidor
        working-directory: platform/dart/server
        run: mkdir -p build && dart compile exe bin/server.dart -o build/sp_server

  flutter-app:
    name: App Flutter (web, Android, iOS e desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/flutter/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Análise (sem avisos)
        run: flutter analyze --fatal-infos
      - name: Testes
        run: flutter test
      - name: Build web
        run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: superponto-web
          path: platform/flutter/app/build/web
          retention-days: 7
