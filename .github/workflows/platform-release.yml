name: SuperPonto v2 — publicação

# Publica a v2 com uma tag platform-vX.Y.Z (as tags v* continuam sendo da v1), ou manualmente em
# Actions → "SuperPonto v2 — publicação" → Run workflow informando a versão (a release cria a tag).
on:
  push:
    tags: ['platform-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex. 2.0.0); cria a release e a tag platform-v<versão>'
        required: true
        default: '2.0.0'
      api_url:
        description: 'Endereço público da API para os apps nativos (ex. https://ponto.suaempresa.com.br)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

env:
  FLUTTER_VERSION: 3.50.1
  # Os apps nativos recebem o endereço do servidor no build (o usuário ainda pode trocar na tela de login).
  API_URL: ${{ inputs.api_url || vars.SUPERPONTO_API_URL || '' }}
  # Nome da versão: a tag (push) ou platform-v<versão informada> (manual).
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('platform-v{0}', inputs.version) }}

jobs:
  image:
    name: Imagem Docker (API Dart + app web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          ver=${RELEASE_TAG#platform-v}
          [ "$ver" != "" ] || ver=dev-${GITHUB_SHA::7}
          echo "image=ghcr.io/${owner}/superponto-v2" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: platform
          target: api-dart
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/flutter/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --release --dart-define=API_URL=${{ env.API_URL }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk superponto-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: platform/flutter/app/superponto-android.apk

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/flutter/app
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build linux --release --dart-define=API_URL=${{ env.API_URL }}
      - run: tar -czf superponto-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: platform/flutter/app/superponto-linux-x64.tar.gz

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: platform/flutter/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release --dart-define=API_URL=${{ env.API_URL }}
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath superponto-windows-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: platform/flutter/app/superponto-windows-x64.zip

  apple:
    name: macOS e iOS (sem assinatura)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: platform/flutter/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build macos --release --dart-define=API_URL=${{ env.API_URL }}
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/SuperPonto.app superponto-macos.zip
      # A distribuição pela App Store/TestFlight exige o certificado e o perfil da conta Apple da empresa.
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=${{ env.API_URL }}
      - run: ditto -c -k --keepParent build/ios/iphoneos/Runner.app superponto-ios-sem-assinatura.zip
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            platform/flutter/app/superponto-macos.zip
            platform/flutter/app/superponto-ios-sem-assinatura.zip

  release:
    name: Release no GitHub
    if: github.ref_type == 'tag' || inputs.version != ''
    needs: [image, android, linux, windows, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: SuperPonto ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/*
          body: |
            SuperPonto v2 — servidor em Dart e app Flutter (web, Android, iOS, Windows, macOS e Linux).

            Imagem do servidor (API + app web na mesma origem): `ghcr.io/${{ github.repository_owner }}/superponto-v2:${{ env.RELEASE_TAG }}` (sem o prefixo "platform-v" na tag da imagem).

            O app de iOS vai sem assinatura: a publicação na App Store exige o certificado da conta Apple da empresa.
