name: App do funcionário (iPhone)

# Gera o projeto iOS do app de ponto do funcionário (Capacitor) e compila para o simulador, conferindo que o
# app constrói no Xcode. Para publicar na App Store/TestFlight é preciso a conta Apple Developer: abra
# ios-funcionario/App no Xcode (ou use fastlane) com o seu certificado e perfil de distribuição.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios-funcionario.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.EXT_SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.EXT_SUPABASE_ACCESS_TOKEN }}

jobs:
  ios:
    name: Compilar iOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Endereço e chave pública do Supabase
        id: keys
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Cadastre os secrets SUPABASE_PROJECT_REF e SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          node scripts/deploy/supabase-setup.mjs keys
      - name: Interface do app
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          VITE_APP_MODE=funcionario VITE_SUPABASE_URL="${{ steps.keys.outputs.supabase_url }}" \
            VITE_SUPABASE_PUBLISHABLE_KEY="${{ steps.keys.outputs.anon_key }}" VITE_SUPABASE_PROJECT_ID=superponto npx vite build
      - name: Projeto iOS
        env:
          PONTOMAX_APP: funcionario
        run: |
          [ -d ios-funcionario ] || npx cap add ios
          npx cap sync ios
          PLIST=ios-funcionario/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'A câmera é usada para a selfie no registro de ponto.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'A localização confirma onde o ponto foi registrado.'" "$PLIST" 2>/dev/null || true
      - name: Compilar para o simulador
        run: |
          cd ios-funcionario/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          (cd build/Build/Products/Release-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/superponto-ios-simulator.zip" App.app)
      - uses: actions/upload-artifact@v4
        with:
          name: superponto-ios-simulador
          path: superponto-ios-simulator.zip
          retention-days: 30
      - name: Resumo
        run: |
          {
            echo "### App iOS compilado (simulador)"
            echo "- O projeto Xcode é gerado por este workflow (ios-funcionario/)."
            echo "- Para TestFlight/App Store: abra no Xcode com a conta Apple Developer e assine."
          } >> "$GITHUB_STEP_SUMMARY"
