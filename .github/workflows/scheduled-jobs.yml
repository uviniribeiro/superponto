name: Tarefas agendadas

# Substitui o agendador do Lovable Cloud. Horários em UTC (Brasília = UTC-3).

on:
  schedule:
    - cron: '0 6 * * *'     # 03:00 robô diário (correções e verificações)
    - cron: '0 10 * * *'    # 07:00 alerta de horas extras
    - cron: '5 10 * * 1'    # 07:05 de segunda: relatório semanal
    - cron: '0 4 1 1 *'     # 01/01: feriados nacionais do ano
    - cron: '0 4 31 12 *'   # 31/12: feriados do ano seguinte
  workflow_dispatch:
    inputs:
      function:
        description: 'Função a executar agora (ex.: system-robot)'
        required: true
        default: system-robot

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.EXT_SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.EXT_SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        if: env.SUPABASE_PROJECT_REF != ''
      - name: Escolher tarefa
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '0 6 * * *')   f=system-robot ;;
            '0 10 * * *')  f=check-overtime ;;
            '5 10 * * 1')  f=send-weekly-report ;;
            '0 4 1 1 *'|'0 4 31 12 *') f=sync-national-holidays ;;
            *) f="${{ inputs.function }}" ;;
          esac
          echo "function=$f" >> "$GITHUB_OUTPUT"
      - name: Chaves do projeto
        id: keys
        if: env.SUPABASE_PROJECT_REF != ''
        run: node scripts/deploy/supabase-setup.mjs keys
      - name: Executar ${{ steps.pick.outputs.function }}
        if: env.SUPABASE_PROJECT_REF != ''
        env:
          URL: ${{ steps.keys.outputs.supabase_url }}
          KEY: ${{ steps.keys.outputs.service_role_key }}
          FN: ${{ steps.pick.outputs.function }}
        run: |
          curl -sS --fail-with-body -X POST "$URL/functions/v1/$FN" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
