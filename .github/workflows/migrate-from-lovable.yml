name: Migrar dados do Lovable Cloud

# Executar UMA vez, manualmente (Actions > Migrar dados do Lovable Cloud > Run workflow),
# com o Lovable Cloud ativo e o projeto Supabase de destino já publicado pelo workflow "Publicar".
# Copia contas (com as senhas atuais), perfis, empresas, marcações e todos os arquivos.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite MIGRAR para substituir os dados do projeto de destino pelos do Lovable Cloud'
        required: true

permissions:
  contents: read

env:
  SOURCE_URL: https://sfbyujjvfxicuuafjtoy.lovable.cloud
  SOURCE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmYnl1amp2ZnhpY3V1YWZqdG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwODg0NzksImV4cCI6MjA4MjY2NDQ3OX0.p6O1t2YgUNiRY-Vr38Rh2qWPh0zC6TqA5RIJpUnx5pU
  MIGRATION_TOKEN: ${{ secrets.LOVABLE_MIGRATION_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.EXT_SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.EXT_SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.EXT_SUPABASE_DB_PASSWORD }}
  SUPER_ADMIN_EMAIL: ${{ vars.SUPER_ADMIN_EMAIL || 'viniciusacacio1@gmail.com' }}
  SUPER_ADMIN_ONLY: ${{ vars.SUPER_ADMIN_ONLY || 'true' }}

jobs:
  migrate:
    if: inputs.confirm == 'MIGRAR'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Chaves do destino
        id: keys
        run: node scripts/deploy/supabase-setup.mjs keys

      - name: Exportar do Lovable Cloud
        run: node scripts/deploy/migrate-from-lovable.mjs export "$RUNNER_TEMP/lovable.json"

      - name: Importar no Supabase próprio
        run: node scripts/deploy/migrate-from-lovable.mjs import "$RUNNER_TEMP/lovable.json"

      - name: Copiar arquivos (fotos, logos, exportações)
        env:
          DEST_URL: ${{ steps.keys.outputs.supabase_url }}
          DEST_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
        run: node scripts/deploy/migrate-from-lovable.mjs storage

      - name: Super Admin único
        run: node scripts/deploy/supabase-setup.mjs admin

      - name: Apagar a cópia temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/lovable.json"
