name: App do funcionário (Android)

# Gera o APK do app de ponto do funcionário (celular) apontando para o Supabase de produção.
# O endereço e a chave pública entram no build (não ficam fixos no código), como os demais instaladores.
# Baixe o APK em Actions > esta execução > Artifacts.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'mobile/**'
      - 'scripts/build-mobile.sh'
      - 'scripts/mobile/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-funcionario.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.EXT_SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.EXT_SUPABASE_ACCESS_TOKEN }}

jobs:
  apk:
    name: Gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (já instalado na máquina do GitHub)
        run: |
          # A ação setup-android tenta instalar o pacote antigo "tools", que não existe mais.
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "SDK em $ANDROID_HOME pronto"

      - name: Endereço e chave pública do Supabase
        id: keys
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Cadastre os secrets SUPABASE_PROJECT_REF e SUPABASE_ACCESS_TOKEN (veja deploy/SUPABASE.md)."
            exit 1
          fi
          node scripts/deploy/supabase-setup.mjs keys

      - name: Compilar APK do funcionário
        env:
          PONTOMAX_KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
          PONTOMAX_KEYSTORE_PASS: ${{ secrets.APP_KEYSTORE_PASS }}
          PONTOMAX_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          PONTOMAX_KEY_PASS: ${{ secrets.APP_KEY_PASS }}
        run: |
          # Com a chave de assinatura nos secrets, gera APK de distribuição; sem ela, APK de teste.
          if [ -n "$PONTOMAX_KEYSTORE_B64" ]; then
            echo "$PONTOMAX_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.jks"
            export PONTOMAX_KEYSTORE="$RUNNER_TEMP/app.jks"
          fi
          bash scripts/build-mobile.sh funcionario \
            --server "${{ steps.keys.outputs.supabase_url }}" \
            --key "${{ steps.keys.outputs.anon_key }}"

      - uses: actions/upload-artifact@v4
        with:
          name: superponto-funcionario-apk
          path: public/downloads/pontomax-funcionario.apk
          retention-days: 30

      - name: Resumo
        run: |
          {
            echo "### APK do app do funcionário gerado"
            echo "- Baixe em **Artifacts › superponto-funcionario-apk**"
            echo "- Registro de ponto com GPS e selfie, registros, banco de horas, ocorrências, férias, QR Code e conta"
            echo "- Clientes da v2 entram no mesmo app (abre o acesso da v2)"
          } >> "$GITHUB_STEP_SUMMARY"
