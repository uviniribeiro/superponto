# Docker Compose para SuperPonto
# Sistema de Ponto Eletrônico com suporte a múltiplos bancos de dados

version: '3.8'

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: superponto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superponto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperPonto@2024}
      POSTGRES_DB: ${POSTGRES_DB:-superponto}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/setup-database.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superponto} -d ${POSTGRES_DB:-superponto}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superponto-network

  # ===========================================
  # Backend API (Express/Node.js)
  # ===========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: superponto-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-superponto}:${POSTGRES_PASSWORD:-SuperPonto@2024}@postgres:5432/${POSTGRES_DB:-superponto}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET com um valor aleatorio forte}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET com um valor aleatorio forte}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - superponto-network

  # ===========================================
  # Frontend (React/Vite)
  # ===========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: superponto-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - superponto-network

  # ===========================================
  # pgAdmin (opcional - gerenciador de banco)
  # ===========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: superponto-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@superponto.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - superponto-network

  # ===========================================
  # Redis (para sessões e cache - opcional)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: superponto-redis
    restart: unless-stopped
    profiles:
      - cache
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superponto-network

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

# ===========================================
# Networks
# ===========================================
networks:
  superponto-network:
    driver: bridge
