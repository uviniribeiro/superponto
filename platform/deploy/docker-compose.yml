# SuperPonto v2 — API + Redis. Banco:
#  - Supabase (padrão): DATABASE_URL aponta para o pooler do Supabase (modo sessão), esquema superponto.
#  - VPS: suba com --profile vps para ter o PostgreSQL 17 aqui mesmo e aponte DATABASE_URL para "db".
# Uso:  docker compose --env-file .env up -d              (Supabase)
#       docker compose --env-file .env --profile vps up -d (PostgreSQL local)
name: superponto

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: superponto/api:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # PostgreSQL próprio (perfil "vps"): usado quando o banco sair do Supabase.
  db:
    profiles: ["vps"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: superponto
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d superponto"]
      interval: 5s
      retries: 10

volumes:
  redis-data:
  db-data:
