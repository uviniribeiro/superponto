# SuperPonto v2 em produção (VPS própria): banco, migrações, API Dart com o app web e HTTPS.
# Ainda NÃO está em uso: hoje o sistema roda na Vercel + Supabase. Veja deploy/README.md.
#
#   cp deploy/.env.example deploy/.env      (preencha)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# O servidor de comunicação de equipamentos fica em outro servidor (repositório
# superponto-communication-server), com o mesmo COMM_SERVER_TOKEN.
name: superponto-v2

x-owner-url: &owner-url
  MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/superponto?schema=superponto

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: superponto
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d superponto"]
      interval: 5s
      retries: 20

  # Migrações, papel de login da API e seed (o administrador da plataforma é irrevogável no banco).
  setup:
    image: ${SETUP_IMAGE:-ghcr.io/uviniribeiro/superponto-v2-setup:latest}
    environment:
      <<: *owner-url
      API_DB_PASSWORD: ${API_DB_PASSWORD:?defina API_DB_PASSWORD}
      SEED_ADMIN_EMAIL: ${ADMIN_EMAIL:-viniciusacacio1@gmail.com}
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    image: ${API_IMAGE:-ghcr.io/uviniribeiro/superponto-v2:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://superponto_api:${API_DB_PASSWORD}@db:5432/superponto?schema=superponto
      APP_URL: https://${DOMAIN:?defina DOMAIN}
      API_URL: https://${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?defina MFA_ENCRYPTION_KEY}
      BIOMETRIC_ENCRYPTION_KEY: ${BIOMETRIC_ENCRYPTION_KEY:?defina BIOMETRIC_ENCRYPTION_KEY}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?defina SECRETS_ENCRYPTION_KEY}
      COMM_SERVER_TOKEN: ${COMM_SERVER_TOKEN:?defina COMM_SERVER_TOKEN}
      MAIL_TRANSPORT: smtp
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-SuperPonto <nao-responda@superponto.local>}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-suporte@superponto.local}
      REP_P_DEVELOPER_CNPJ: ${REP_P_DEVELOPER_CNPJ:-}
    depends_on:
      db: { condition: service_healthy }
      setup: { condition: service_completed_successfully }

  # HTTPS automático (Let's Encrypt) para o DOMAIN.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    command: caddy reverse-proxy --from ${DOMAIN} --to api:3000
    volumes: [caddy-data:/data]
    depends_on: [api]

volumes:
  db-data:
  caddy-data:
